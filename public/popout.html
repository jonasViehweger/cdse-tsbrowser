<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>CDSE TS Browser</title>
    <script>
      // Popouts have their own <html>; App.vue keeps this in sync after opening.
      document.documentElement.dataset.theme = window.opener?.document.documentElement.dataset.theme ?? ''
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; width: 100%; overflow: hidden; }
    </style>
  </head>
  <body></body>
</html>
